name: staff_portal
description: "Food Angel Smart HR Tool — Staff Portal Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.5.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0

  # UI & Design
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1

  # QR / Barcode scanning
  mobile_scanner: ^5.2.3

  # Location
  geolocator: ^13.0.1

  # Date & Time
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
